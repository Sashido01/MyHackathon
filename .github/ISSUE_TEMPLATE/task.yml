name: Task / Задача
description: Запланированная работа или исследование
title: "task: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Что нужно получить и почему?
      placeholder: Опишите проверяемый результат.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии готовности
      placeholder: Как проверить, что задача завершена?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Зависимости и ограничения
      description: Необязательные вводные, ссылки на требования, риски.
    validations:
      required: false
